[package]
name = "notes"
version = "0.1.0"
edition = "2021"
description = "A simple terminal notes manager with persistent storage"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"], default-features = false }

[profile.release]
strip = true
lto = true
